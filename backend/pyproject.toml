[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "fastapi[standard]",
    "mkdocs>=1.6.1",
    "mkdocs-include-markdown-plugin>=7.3.0",
    "mkdocs-material>=9.7.6",
    "mkdocs-swagger-ui-tag>=0.8.0",
    "mkdocstrings>=1.0.4",
    "mkdocstrings-python>=2.0.5",
    "numpy>=2.4.6",
    "pillow>=12.2.0",
    "pydicom>=3.0.2",
    "python-multipart>=0.0.32",
    "scikit-image>=0.26.0",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.49.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28.1",
    "pytest>=9.1.0",
    "pytest-mock>=3.15.1",
]

[dependency-groups]
dev = [
    "jupytext>=1.19.3",
    "matplotlib>=3.11.0",
    "ruff>=0.15.16",
    "ty>=0.0.46",
]

[tool.fastapi]
entrypoint = "src.main:app"
