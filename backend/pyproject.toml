[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "fastapi[standard]",
    "numpy>=2.4.6",
    "pillow>=12.2.0",
    "pydicom>=3.0.2",
    "python-multipart>=0.0.32",
    "scikit-image>=0.26.0",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
    "ty>=0.0.46",
]

[tool.fastapi]
entrypoint = "src.main:app"